name: One-shot align v1.6.7 internal versions

on:
  push:
    branches:
      - main
    paths:
      - ".github/align-v1.6.7.trigger"

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Align internal version constants
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          replacements = {
              "app/censorarr.py": [('VERSION = "1.6.5"', 'VERSION = "1.6.7"')],
              "app/webapp_core.py": [('VERSION = "1.6.5"', 'VERSION = "1.6.7"')],
              "app/integrations.py": [('VERSION = "1.6.5"', 'VERSION = "1.6.7"')],
              "gpu-worker/app/worker.py": [("VERSION = '1.6.5'", "VERSION = '1.6.7'")],
              "README.md": [("# Censorarr 1.6.5", "# Censorarr 1.6.7")],
              "config.example.yaml": [("# Censorarr v1.6.5", "# Censorarr v1.6.7")],
          }

          for name, pairs in replacements.items():
              p = Path(name)
              text = p.read_text(encoding="utf-8")
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f"Expected {old!r} in {name}")
                  text = text.replace(old, new, 1)
              p.write_text(text, encoding="utf-8")
          PY

          python -m py_compile app/censorarr.py app/webapp_core.py app/integrations.py gpu-worker/app/worker.py

      - name: Commit aligned versions
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/align-v1.6.7.trigger
          rm -f .github/workflows/one-shot-align-v1.6.7.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Align internal version strings to v1.6.7"
          git push origin HEAD:main
