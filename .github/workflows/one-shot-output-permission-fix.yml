name: One-shot output permission fix

on:
  push:
    branches:
      - main
    paths:
      - ".github/censorarr-output-permission-fix.trigger"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch Censorarr and bump version
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          OLD_VERSION = "1.6.5"
          NEW_VERSION = "1.6.6"

          app_path = Path("app/censorarr.py")
          text = app_path.read_text(encoding="utf-8")

          old_version_line = f'VERSION = "{OLD_VERSION}"'
          new_version_line = f'VERSION = "{NEW_VERSION}"'
          if text.count(old_version_line) != 1:
              raise SystemExit(f"Expected exactly one {old_version_line!r} in {app_path}")
          text = text.replace(old_version_line, new_version_line, 1)

          old_safety = '"preserve_owner_mode": True, "backup_original": False,'
          new_safety = '"preserve_owner_mode": True, "ensure_readable_output": True, "backup_original": False,'
          if text.count(old_safety) != 1:
              raise SystemExit("Could not locate DEFAULT_CONFIG safety settings")
          text = text.replace(old_safety, new_safety, 1)

          start = text.index("def preserve_metadata(")
          end = text.index("\ndef fmt_time(", start)
          replacement = '''def preserve_metadata(src_stat: os.stat_result, temp_out: Path, cfg: dict) -> None:
              safety = cfg.get("safety", {})
              preserve_owner_mode = bool(safety.get("preserve_owner_mode", True))
              ensure_readable_output = bool(safety.get("ensure_readable_output", True))

              if not preserve_owner_mode and not ensure_readable_output:
                  return

              # Preserve source ownership first. POSIX chown can clear special mode bits,
              # so chmod is intentionally applied after ownership restoration.
              if preserve_owner_mode:
                  try:
                      os.chown(temp_out, src_stat.st_uid, src_stat.st_gid)
                  except (OSError, AttributeError, PermissionError) as exc:
                      logging.debug("Could not preserve owner/group on %s: %s", temp_out, exc)

              if preserve_owner_mode:
                  target_mode = src_stat.st_mode & 0o7777
              else:
                  try:
                      target_mode = temp_out.stat().st_mode & 0o7777
                  except OSError as exc:
                      logging.warning("Could not read output permissions for %s: %s", temp_out, exc)
                      return

              # Processed media must remain readable by Plex/media services. Preserve
              # any broader source permissions while guaranteeing read access for all.
              if ensure_readable_output:
                  target_mode |= 0o444

              try:
                  os.chmod(temp_out, target_mode)
              except OSError as exc:
                  logging.warning("Could not set processed-media permissions on %s: %s", temp_out, exc)
          '''
          replacement = "\n".join(line[12:] if line.startswith("            ") else line for line in replacement.splitlines())
          text = text[:start] + replacement.rstrip() + "\n\n" + text[end + 1:]
          app_path.write_text(text, encoding="utf-8")

          worker_path = Path("gpu-worker/app/worker.py")
          worker = worker_path.read_text(encoding="utf-8")
          old_worker_version = f"VERSION = '{OLD_VERSION}'"
          new_worker_version = f"VERSION = '{NEW_VERSION}'"
          if worker.count(old_worker_version) != 1:
              raise SystemExit(f"Expected exactly one GPU worker version {old_worker_version!r}")
          worker_path.write_text(worker.replace(old_worker_version, new_worker_version, 1), encoding="utf-8")

          version_path = Path("VERSION")
          if version_path.read_text(encoding="utf-8").strip() != OLD_VERSION:
              raise SystemExit("VERSION file is not at expected starting version")
          version_path.write_text(NEW_VERSION + "\n", encoding="utf-8")

          config_path = Path("config.example.yaml")
          config = config_path.read_text(encoding="utf-8")
          old_config = "  preserve_owner_mode: true\n  backup_original: false"
          new_config = (
              "  preserve_owner_mode: true\n"
              "  # Keep processed replacements readable by Plex/media services even if the source is 0700/0600.\n"
              "  ensure_readable_output: true\n"
              "  backup_original: false"
          )
          if config.count(old_config) != 1:
              raise SystemExit("Could not locate safety block in config.example.yaml")
          config_path.write_text(config.replace(old_config, new_config, 1), encoding="utf-8")

          changelog_path = Path("CHANGELOG.md")
          changelog = changelog_path.read_text(encoding="utf-8")
          header = "# Changelog\n\n"
          if not changelog.startswith(header):
              raise SystemExit("Unexpected CHANGELOG.md header")
          section = f'''## {NEW_VERSION}

          - Fixed processed media retaining restrictive source permissions such as `0700`/`0600`, which could make a movie disappear from Plex after Censorarr replaced the original file.
          - Added `safety.ensure_readable_output` (default `true`). Censorarr now preserves existing owner/group and broader mode bits while guaranteeing read access for owner, group, and other on the processed replacement.
          - Permission-setting failures are now logged instead of being silently ignored.
          - Main app and GPU worker now report version `{NEW_VERSION}`.

          '''
          section = "\n".join(line[10:] if line.startswith("          ") else line for line in section.splitlines()) + "\n"
          changelog_path.write_text(header + section + changelog[len(header):], encoding="utf-8")
          PY

      - name: Validate patch
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile app/censorarr.py gpu-worker/app/worker.py
          python - <<'PY'
          from pathlib import Path

          text = Path("app/censorarr.py").read_text(encoding="utf-8")
          if 'VERSION = "1.6.6"' not in text:
              raise SystemExit("Main version was not bumped")
          if '"ensure_readable_output": True' not in text:
              raise SystemExit("Default safety setting was not added")
          if 'target_mode |= 0o444' not in text:
              raise SystemExit("Readable-output enforcement is missing")

          source_mode = 0o700
          fixed_mode = source_mode | 0o444
          if fixed_mode != 0o744:
              raise SystemExit(f"Unexpected 0700 conversion: {oct(fixed_mode)}")
          if not (fixed_mode & 0o004):
              raise SystemExit("Plex/other-read bit is still missing")

          if Path("VERSION").read_text(encoding="utf-8").strip() != "1.6.6":
              raise SystemExit("VERSION file mismatch")
          if "VERSION = '1.6.6'" not in Path("gpu-worker/app/worker.py").read_text(encoding="utf-8"):
              raise SystemExit("GPU Worker version mismatch")
          print("Censorarr 1.6.6 permission regression checks passed")
          PY

      - name: Commit clean fix to main
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/censorarr-output-permission-fix.trigger
          rm -f .github/workflows/one-shot-output-permission-fix.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Fix processed media permissions and bump v1.6.6"
          git push origin HEAD:main
